name: sandbox-lernknoten

services:
  web:
    image: nginx:1.27-alpine
    container_name: sandbox-lernknoten
    restart: unless-stopped
    ports:
      # Nur zum Testen direkt auf dem Server (http://localhost:8091). Von aussen kommt alles über Caddy.
      - "127.0.0.1:${SANDBOX_PORT:-8091}:80"
    volumes:
      # Das ganze Repo, nur lesend. Nach einem git pull ist alles sofort live.
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - proxy

networks:
  proxy:
    # Gemeinsames Netzwerk mit Caddy, bereits vorhanden (siehe README)
    external: true
