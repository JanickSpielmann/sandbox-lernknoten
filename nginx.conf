server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Weiterleitungen relativ halten, weil Caddy davor die Verschlüsselung übernimmt
    absolute_redirect off;

    # Live Eingabe für input() und sanftes Stoppen in der Python Sandbox brauchen einen geteilten Speicher
    # (SharedArrayBuffer). Der Browser erlaubt ihn nur mit diesen beiden Headern. Pyodide und SQLite kommen von
    # cdn.jsdelivr.net, das die nötigen CORP Header selbst sendet. Ohne die Header läuft die Seite weiter,
    # dann gibt es statt der Live Eingabe das Feld "Eingaben".
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache";

    # Konfigurationsdateien und Quellen nicht ausliefern
    location ~ ^/(docker-compose\.yml|nginx\.conf|README\.md|LICENSE|setup-winkel\.sh|CNAME|\.gitattributes)$ {
        return 404;
    }

    # Versteckte Dateien (z.B. .git) nicht ausliefern
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
}
